<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f4f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0c0e" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Финансы">
  <title>Мои финансы</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=0.4.1">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1 id="title">Операции</h1>
      <button id="syncBadge" class="badge" data-act="badge" type="button">…</button>
    </div>
  </header>

  <main>
    <section id="view-home" class="view"></section>
    <section id="view-reports" class="view" hidden></section>
    <section id="view-cats" class="view" hidden></section>
    <section id="view-settings" class="view" hidden></section>
  </main>

  <button id="fab" class="fab" data-act="new-tx" type="button" aria-label="Добавить операцию"><i data-icon="plus"></i></button>

  <nav class="tabbar">
    <button type="button" data-act="nav" data-view="home" class="active"><i data-icon="list"></i>Операции</button>
    <button type="button" data-act="nav" data-view="reports"><i data-icon="pie"></i>Отчёты</button>
    <button type="button" data-act="nav" data-view="cats"><i data-icon="grid"></i>Категории</button>
    <button type="button" data-act="nav" data-view="settings"><i data-icon="sliders"></i>Настройки</button>
  </nav>

  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <button type="button" class="icon-btn flat" data-act="close-modal" aria-label="Закрыть"><i data-icon="close"></i></button>
        <h2 id="modal-title"></h2>
        <span></span>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="icons.js?v=0.4.1"></script>
  <script src="app.js?v=0.4.1"></script>
</body>
</html>
